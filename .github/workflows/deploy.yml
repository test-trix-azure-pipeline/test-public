name: Build and Deploy to Azure Container Apps
on:
  push:
    branches: [ main ]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # environment: production # omit if you didn't create this environment in S
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Ensure system-assigned identity
        run: |
          az containerapp identity assign \
            --system-assigned \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }}

      - name: Sync Key Vault secrets to Container App
        run: |
          set -euo pipefail
          VAULT_NAME="${{ vars.KEY_VAULT_NAME }}"

          mapfile -t SECRET_NAMES < <(az keyvault secret list \
            --vault-name "$VAULT_NAME" \
            --query "[].name" -o tsv)

          CA_SECRETS=()
          for NAME in "${SECRET_NAMES[@]}"; do
            SECRET_URI=$(az keyvault secret show \
              --vault-name "$VAULT_NAME" \
              --name "$NAME" \
              --query id -o tsv)
            CA_SECRETS+=("${NAME}=keyvaultref:${SECRET_URI},identityref:system")
          done

          az containerapp secret set \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --secrets "${CA_SECRETS[@]}"

          printf '%s\n' "${SECRET_NAMES[@]}" > secret-names.txt

      - name: Mount Key Vault secrets as a volume and deploy
        run: |
          set -euo pipefail
          az containerapp show \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            -o yaml > app.yaml

          yq -i '.properties.template.containers[0].image = strenv(IMAGE)' app.yaml
          yq -i '.properties.template.volumes = [{"name": "kv-secrets", "storageType": "Secret", "secrets": []}]' app.yaml
          yq -i '.properties.template.containers[0].volumeMounts = [{"volumeName": "kv-secrets", "mountPath": "/mnt/secrets"}]' app.yaml

          while IFS= read -r NAME; do
            NAME="$NAME" yq -i '.properties.template.volumes[0].secrets += [{"secretRef": strenv(NAME), "path": strenv(NAME)}]' app.yaml
          done < secret-names.txt

          az containerapp update \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --yaml app.yaml
