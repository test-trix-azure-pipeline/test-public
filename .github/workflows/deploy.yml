name: Build and Deploy to Azure Container Apps
on:
  push:
    branches: [ main ]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # environment: production # omit if you didn't create this environment in S
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      # Writes .env on the runner from GitHub vars/secrets right before the
      # build — the file isn't tracked in git, so it doesn't exist in the
      # checkout otherwise. Add one line per build-time var/secret you need.
      - name: Write .env for build
        run: |
          cat > .env <<EOF
          EOF

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ github.event.repository.name }}:${{ github.sha }}"
          docker build --secret id=env_file,src=.env -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          rm -f .env

      - name: Ensure system-assigned identity
        run: |
          az containerapp identity assign \
            --system-assigned \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }}

      - name: Set Key Vault secret references
        run: |
          az containerapp secret set \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --secrets \
              test-vault-1=keyvaultref:${{ secrets.TEST_VAULT_1 }},identityref:system

      # - name: Deploy new revision to Container App
      #   run: |
      #     az containerapp update \
      #       --name ${{ vars.CONTAINERAPP_NAME }} \
      #       --resource-group ${{ vars.RESOURCE_GROUP }} \
      #       --image "$IMAGE" \
      #       --set-env-vars \
      #         TEST_VAULT_1=secretref:test-vault-1 

      - name: Mount test-vault-1 as a volume file
        run: |
          az containerapp show \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            -o yaml > app.yaml

          yq -i '.properties.template.containers[0].image = strenv(IMAGE)' app.yaml
          yq -i '.properties.template.volumes = [{"name": "kv-secrets", "storageType": "Secret", "secrets": [{"secretRef": "test-vault-1", "path": ".env"}]}]' app.yaml
          yq -i '.properties.template.containers[0].volumeMounts = [{"volumeName": "kv-secrets", "mountPath": "/mnt/secrets/envfile"}]' app.yaml

          az containerapp update \
            --name ${{ vars.CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --yaml app.yaml
